name: CI

on:
  push:
    branches: [main, testnet-migration]
  pull_request:

jobs:
  backend:
    name: Backend (lint, typecheck, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  frontend:
    name: Frontend (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.app.json
      - run: npm test
      - run: npm run build

  contracts:
    name: Move contracts (unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/shelby-research
    steps:
      - uses: actions/checkout@v4
      - name: Install aptos CLI
        run: curl -fsSL https://aptos.dev/scripts/install_cli.py | python3
      - name: Run Move unit tests
        run: ~/.local/bin/aptos move test
